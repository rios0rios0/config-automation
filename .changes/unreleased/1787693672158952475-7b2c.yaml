kind: 'Changed'
body: 'closed the fast-forward merge path on `main` and made the rebase-update button part of the policy. `allow_rebase_merge` stays on repo-wide because it is the only toggle that surfaces GitHub''s "Update with rebase" control — but it also surfaces "Rebase and merge", which lands a pull request without the merge commit. The fast-forward is now blocked one level down: the `main-protection` ruleset carries a `pull_request` rule whose `allowed_merge_methods` is pinned to `merge` alone, so `main` accepts merge commits and nothing else while the update button survives. A ruleset can only narrow what the repository already allows, so the repo settings and the ruleset are two halves of one decision. The policy also now enforces `allow_update_branch` ("Always suggest updating pull request branches"), which was previously unmanaged and off on 58 of 61 repos: without it the "Update branch" control only appears when branch protection requires the branch be up to date before merging, which this policy does not require. The audit reports both as `allow_update_branch=` and `ruleset_allowed_merge_methods=`, and the phase 1 table gained `UPD-BR` and `MERGE-M` columns — the latter sitting next to `NO-FP` precisely because the two are easy to confuse: `non_fast_forward` blocks FORCE PUSHES and says nothing about how pull requests land.'
