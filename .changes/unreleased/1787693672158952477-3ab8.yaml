kind: 'Fixed'
body: 'fixed phase 4 failing with `422 Name must be unique` on every repo that already had a `main-protection` ruleset. `applyRuleset` only ever POSTed a new ruleset, which was correct while a non-compliant ruleset almost always meant no ruleset existed. Pinning `allowed_merge_methods` changed that: every existing ruleset became non-compliant because it predates the `pull_request` rule, so the common case is now "exists but drifted" and GitHub rejects a POST whose name is taken. `BranchProtectionsRepository` gained `UpdateRuleset`, and `applyRuleset` now rewrites the ruleset by the ID the audit already carries, creating only when there is genuinely nothing there. Applied against the fleet this was the difference between 0 and 70 rulesets updated.'
time: '2026-08-26T04:00:00.000000000Z'
