kind: 'Fixed'
body: 'fixed a repository with an unprotected default branch being dropped from every phase. `go-github` collapses the `404 Branch not protected` response into its `ErrBranchNotProtected` sentinel — a plain `errors.New` that carries neither the status code nor the API''s own wording — so `FindProtectionByBranch` matched neither `isStatusCode(err, 404)` nor the literal `"Branch not protected"` string, and the error escaped as a hard `AuditError`. Because phases 2-4 consult the audit rather than the live API, a repo in that state was silently skipped by settings, security, and protection alike: `rios0rios0/ccswitch` sat completely unhardened while the audit reported only `audit_error`. The check now tests the sentinel with `errors.Is` first. This predates the `v75` bump; the sentinel exists in `v66` too.'
time: '2026-08-26T04:00:01.000000000Z'
