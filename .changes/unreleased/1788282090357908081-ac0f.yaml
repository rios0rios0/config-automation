kind: 'Fixed'
body: 'stopped the weekly configuration and documentation refresh from hand-editing a generated `CHANGELOG.md`. Every target repository uses [chlog](https://github.com/luizjhonata/chlog), where `CHANGELOG.md` is compiled from the fragments under `.changes/unreleased/` — so an entry written straight into it is discarded by the next `chlog batch`, and it puts back on that one file exactly the rebase conflicts the fragments exist to prevent. The 2026-08-31 run did that to 46 repositories at once, because the prompt told Claude to edit the changelog and the tool grant let it. The refresh now decides the convention per repository — `chlog`, `changelog`, or `none` — using the same predicate as the `pipelines` basic-checks gate and AutoBump''s `DetectChlog` (`.chlog.yaml`, `.chlog.yml`, or a `.changes/unreleased/` directory), appends the matching half of the prompt''s new `Recording the change` section to that repository''s prompt, and grants only the tool that convention needs: `Edit(/.changes/unreleased/**)`, `Edit(/CHANGELOG.md)`, or nothing. Withholding the grant is what makes the wrong target impossible rather than merely discouraged; a post-refresh guard additionally reverts any `CHANGELOG.md` or existing-fragment change in a chlog repository, and rejects a new fragment missing a `kind:`, `body:`, or `time:` line with a `fragment:` failure. Every grant is now spelled `Edit(...)` as well, because the CLI matches file permissions on `Edit` rules alone — the four `Write(...)` entries the allowlist carried had never granted anything'
