kind: 'Changed'
body: 'stopped the weekly configuration and documentation refresh from re-examining a repository whose code has not moved. 47 of the fleet''s 76 repositories opened a pull request on 2026-08-31 — 62%, one week after the same job had refreshed them — because the prompt''s "only if meaningfully drifted" bar is a judgement the model re-makes from scratch every run: `rios0rios0/srt` yielded two entries on 2026-08-31 and none on 2026-09-01 against an unchanged `main`. The refresh now reads, after the clone and before the ~3-minute `claude` call, the date of the last commit that touched anything outside its own output (`CLAUDE.md`, `.github/copilot-instructions.md`, `.github/skills/code-review/SKILL.md`, `.changes/`, `CHANGELOG.md`) and skips the repository when that is older than `stale_after_days`, default 8 — one day past the weekly cadence. Excluding the refresh''s own output is the whole design: the default branch''s HEAD date is self-defeating, because merging a refresh pull request moves `main` and makes every repository the job touched look busy the following week, which is the loop the gate exists to break. Skipped repositories are reported on an `unchanged` summary line, a single-repo `workflow_dispatch` run is never skipped, and `stale_after_days: 0` restores the old behaviour'
time: '2026-09-01T18:42:53.569322658Z'
