kind: 'Added'
body: 'added a compliance rule requiring forks to keep GitHub Actions disabled: a fork carries the workflows of its upstream verbatim and nothing in this account needs a fork to run any, so phase 1 now reads the repository-level switch from `GET /repos/{owner}/{repo}/actions/permissions` (covered by the audit PAT via `Administration: read`), reports a fork whose switch is on as `actions_enabled=true(want false)` — or `actions_enabled=unknown` when it could not be read, mirroring `dependabot_alerts` — and phase 3 turns it off on forks only through `SecuritySettingsRepository.DisableActions`, which `--dry-run` shows as `actions_disabled`; repositories of our own are never checked, the audit table gained an `ACTIONS` column, and the phase 5 report diffs `actions_enabled`'
time: '2026-09-05T20:21:50.24292742Z'
