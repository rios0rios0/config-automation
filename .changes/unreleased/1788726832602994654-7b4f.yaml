kind: 'Fixed'
body: 'stopped the weekly config-and-docs refresh from writing a gitleaks finding into every repository it touches. The code-review skill it generates warns against credential-shaped fixtures, and until now nothing told it how to phrase that warning, so it spelled the vendor prefixes out — including the hyphenated Slack bot-token prefix, which the GitLab-customised rule set the shared `sast:gitleaks` stage runs matches on its own with no body check. 39 repositories carry that sentence today and each one fails the stage the moment it adopts a language pipeline, because the scan on `main` walks the whole history reachable from `HEAD`. `scripts/refresh_config_and_docs_prompt.md` now forbids credential-shaped literals in every file the refresh writes, fixes one approved wording for that bullet whose prefixes stop short of what the rules match, and treats an existing shape-quoting bullet as drift to be replaced; this repository''s own `.github/skills/code-review/SKILL.md` was aligned to that wording'
