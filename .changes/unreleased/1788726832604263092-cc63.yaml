kind: 'Added'
body: 'added a secret-shape guard to `config-and-docs-refresh.yaml`: after drift detection it reads the added lines of the drifted in-scope files and skips the repository with `secret-shape:` when one carries a credential shape — the hyphenated Slack bot-token prefix, a PEM private-key banner, a completed GitHub or AWS prefix, or a JWT-shaped string. The prompt rule alone depends on the model complying, and the cost of a lapse is a finding that only a `.gitleaksignore` fingerprint can clear, which this job is granted no tool to write. It reads added lines only, so the fleet''s older skills — which still carry the old wording — do not fail runs that never touched them'
