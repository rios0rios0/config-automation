kind: 'Added'
body: 'added the shared ignore rules of `rios0rios0/pipelines` to the weekly refresh: given `--pipelines-dir`, `refresh-docs run` runs the pipelines `make gitignore` generator on each clone before Claude does, with no token in its environment, so the generator alone decides which language fragments a repository gets; the prompt asks Claude to record the change, a changed `.gitignore` opens the PR on its own, a symlinked `.gitignore` is skipped with a warning, and a generator failure records the repository as `gitignore:`. The GitHub workflow clones `pipelines` for every leg, and the Azure Pipelines template checks out the repository resource its new `pipelinesRepository` parameter names, empty by default, which leaves every `.gitignore` alone'
