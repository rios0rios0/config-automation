name: 'Config and Docs Refresh'

on:
  schedule:
    # Weekly on Mondays at 07:00 UTC (one hour after the compliance audit to spread load).
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target a single repo as `owner/name`, or a bare `name` to use the first configured owner (optional, defaults to all non-fork non-archived across every owner).'
        required: false
        type: 'string'
      batch_size:
        description: 'Repos processed sequentially per matrix leg (defaults to 10).'
        required: false
        type: 'number'
        default: 10
      max_parallel:
        description: 'Concurrent matrix legs (defaults to 2 to halve wall-clock; raise carefully to stay within the Anthropic rate limit).'
        required: false
        type: 'number'
        default: 2
      max_turns:
        description: 'Max claude reasoning turns per repo (defaults to 50; raise if you see "Reached max turns" on a legitimately complex repo).'
        required: false
        type: 'number'
        default: 50
      stale_after_days:
        description: 'Skip a repo whose code has not changed in this many days — measured over everything except this job''s own output, so refresh, bump and changelog-only commits do not count (defaults to 8, one day past the weekly cadence). Set to 0 to refresh every repo regardless.'
        required: false
        type: 'number'
        default: 8

concurrency:
  group: 'config-and-docs-refresh'
  cancel-in-progress: false

jobs:
  discover:
    name: 'Enumerate and batch target repos'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    env:
      # Owners to enumerate, each paired with the secret holding its token. A
      # fine-grained PAT is bound to a single resource owner, so one token can never
      # span all of them; enumeration therefore runs once per owner with that owner's
      # credential. Adding an owner means adding an entry here plus its `TOKEN_*` env
      # line on the `Build matrix` step.
      OWNERS: >-
        [{"name": "rios0rios0", "secret": "PERSONAL_ACCESS_TOKEN"},
         {"name": "medhub-life", "secret": "MEDHUB_ACCESS_TOKEN"},
         {"name": "prefy", "secret": "PREFY_ACCESS_TOKEN"}]
      # A bare `repo` input keeps its old ergonomics by resolving against this owner.
      DEFAULT_OWNER: 'rios0rios0'
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
      failed_owners: ${{ steps.build-matrix.outputs.failed_owners }}
    steps:
      - name: 'Checkout config-automation'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      # Derives the toolchain from `go.mod` rather than a hardcoded minor
      # version. `setup-go` exports `GOTOOLCHAIN=local`, so a `go-version`
      # spec that resolves to a cached patch release older than the `go`
      # directive (e.g. `1.26` -> 1.26.4 against `go 1.26.5`) makes every
      # `go run` hard-fail instead of downloading the newer toolchain.
      - name: 'Set up Go'
        uses: 'actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16' # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Enumerates repos via `harden-repos --list-json` (or the single-repo
      # override), then chunks the sorted array into fixed-size batches so
      # the matrix has O(repos / batch_size) legs instead of one leg per
      # repo. Each leg loops through its batch internally --- trades a
      # little per-repo log isolation for a dramatically cleaner
      # pipeline-run UI as the org grows.
      - name: 'Build matrix'
        id: 'build-matrix'
        env:
          # One fine-grained PAT per owner, looked up in the script as
          # `TOKEN_<owner with '-' replaced by '_'>`. Every token's lifetime must be
          # 366 days or less: `medhub-life` and `prefy` reject longer-lived fine-grained
          # tokens with `403 ... forbids access via a fine-grained personal access tokens
          # if the token's lifetime is greater than 366 days`.
          # Scoped to this step only so the PATs aren't exposed to checkout/setup steps.
          TOKEN_rios0rios0: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TOKEN_medhub_life: ${{ secrets.MEDHUB_ACCESS_TOKEN }}
          TOKEN_prefy: ${{ secrets.PREFY_ACCESS_TOKEN }}
          REPO_INPUT: ${{ inputs.repo }}
          BATCH_SIZE: ${{ inputs.batch_size || 10 }}
        run: |
          set -euo pipefail
          # `inputs.batch_size` is a free-form workflow_dispatch value that
          # flows into `jq` as `range(0; length; $batchSize)`. A 0, negative,
          # or non-integer value would crash jq or produce an empty matrix,
          # so normalize to a positive integer (fall back to 10 otherwise).
          if ! [[ "${BATCH_SIZE}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Warning: invalid batch_size='${BATCH_SIZE}', falling back to 10." >&2
            BATCH_SIZE=10
          fi
          # Resolves the per-owner PAT exposed as TOKEN_<owner with '-' replaced by '_'>.
          owner_token() {
            local var="TOKEN_${1//-/_}"
            printf '%s' "${!var:-}"
          }

          # Resolves the secret NAME for an owner, so each batch can tell the refresh
          # job which credential to clone and push with.
          owner_secret() {
            printf '%s' "${OWNERS}" | jq -r --arg o "$1" '.[] | select(.name == $o) | .secret'
          }

          failed_owners=()

          if [ -n "${REPO_INPUT}" ]; then
            # Single-repo override for workflow_dispatch testing. Uses gh's
            # built-in `gh api` so we don't spin up the Go binary just to
            # fetch one default_branch. Accepts `owner/name` so any
            # configured owner is reachable; a bare `name` keeps the old
            # ergonomics by defaulting to DEFAULT_OWNER.
            case "${REPO_INPUT}" in
              */*) target="${REPO_INPUT}" ;;
              *)   target="${DEFAULT_OWNER}/${REPO_INPUT}" ;;
            esac
            target_owner="${target%%/*}"
            target_name="${target#*/}"
            GH_TOKEN="$(owner_token "${target_owner}")"
            export GH_TOKEN
            default_branch=$(gh api "/repos/${target}" --jq '.default_branch')
            # Built with `jq -n` rather than printf so a name containing
            # quotes cannot break out of the JSON string.
            repos=$(jq -cn \
              --arg o "${target_owner}" \
              --arg n "${target_name}" \
              --arg b "${default_branch}" \
              --arg s "$(owner_secret "${target_owner}")" \
              '[{owner: $o, name: $n, default_branch: $b, secret: $s}]')
          else
            # `--list-json` treats a listing failure for any owner as fatal, so it runs
            # once per owner with that owner's own token. A single shared token used to
            # abort the whole enumeration on the first rejected grant, which silently
            # dropped every owner after it in the list. Now an unreachable owner is
            # recorded, the reachable ones are still refreshed, and the `verify` job
            # turns the run red at the end so the gap cannot pass as success.
            repos='[]'
            while IFS= read -r owner; do
              secret="$(owner_secret "${owner}")"
              token="$(owner_token "${owner}")"
              if [ -z "${token}" ]; then
                echo "::error::No token for '${owner}': the '${secret}' secret is empty or not set."
                failed_owners+=("${owner}")
                continue
              fi
              if ! owner_repos=$(HARDEN_OWNER="${owner}" GH_TOKEN="${token}" \
                go run ./cmd/harden-repos --list-json 2>"${RUNNER_TEMP}/${owner}.err"); then
                echo "::error::Could not enumerate '${owner}', so none of its repositories will be refreshed."
                sed 's/^/  /' "${RUNNER_TEMP}/${owner}.err" >&2
                failed_owners+=("${owner}")
                continue
              fi
              owner_repos="${owner_repos:-[]}"
              repos=$(jq -cn \
                --argjson acc "${repos}" \
                --argjson add "${owner_repos}" \
                --arg s "${secret}" \
                '$acc + ($add | map(. + {secret: $s}))')
              echo "Enumerated $(printf '%s' "${owner_repos}" | jq 'length') repo(s) in '${owner}'."
            done < <(printf '%s' "${OWNERS}" | jq -r '.[].name')
          fi
          # Chunk within each owner rather than across the whole fleet, so every matrix
          # leg carries exactly one owner and therefore exactly one credential.
          matrix=$(printf '%s' "${repos}" | jq -c --argjson batchSize "${BATCH_SIZE}" '
            group_by(.owner)
            | map(
                . as $g
                | ($g[0].owner) as $owner
                | ($g[0].secret) as $secret
                | [range(0; ($g | length); $batchSize) as $i
                   | {
                       name: ($owner + " batch_" + (((($i / $batchSize) + 1) | floor | tostring) | if length == 1 then "0" + . else . end)),
                       owner: $owner,
                       secret: $secret,
                       repos: ($g[$i : $i + $batchSize] | map(del(.secret)))
                     }]
              )
            | add // []')
          count=$(printf '%s' "${matrix}" | jq 'length')
          total=$(printf '%s' "${matrix}" | jq '[.[] | .repos | length] | add // 0')
          if [ "${#failed_owners[@]}" -eq 0 ]; then
            failed_json='[]'
          else
            failed_json=$(jq -cn '$ARGS.positional' --args "${failed_owners[@]}")
          fi
          {
            echo "matrix=${matrix}"
            echo "count=${count}"
            echo "failed_owners=${failed_json}"
          } >> "${GITHUB_OUTPUT}"
          echo "Discovered ${total} target repo(s) across ${count} batch(es) of up to ${BATCH_SIZE}."
          printf '%s' "${matrix}" | jq '[.[] | {name, owner, count: (.repos | length)}]'

  refresh:
    name: 'Refresh ${{ matrix.batch.name }}'
    needs: 'discover'
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Each matrix leg handles up to `batch_size` repos sequentially; legs
      # themselves run in parallel up to `max_parallel`. The default of 2
      # halves wall-clock vs. fully serial while keeping the steady-state
      # request rate well inside the Anthropic per-minute budget. Raise
      # carefully --- a wider parallel burst chews through the per-minute
      # rate limit and amplifies the cost of the permission-denial loop
      # that each no-drift repo incurs.
      max-parallel: ${{ fromJSON(inputs.max_parallel || '2') }}
      matrix:
        batch: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: 'Checkout config-automation (for prompt)'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Install Node.js 20'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '20.x'

      - name: 'Install Claude Code CLI'
        run: 'npm install -g @anthropic-ai/claude-code'

      # Tool allowlist locked down to exactly what the refresh prompt
      # needs: read the repo, edit/create the three guidance files
      # (`CLAUDE.md`, `.github/copilot-instructions.md`, and the Copilot
      # code-review skill at `.github/skills/code-review/SKILL.md`), plus
      # whichever changelog target that repository's convention calls for
      # --- see `changelog_mode` in the loop below. Without this allowlist,
      # telemetry showed ~30 `permission_denials_count` per run because the
      # CLI probes many tools but the default harness denies most of them,
      # which burned turns and API spend on every no-drift no-op. See
      # `scripts/refresh_config_and_docs_prompt.md` for the rules that match
      # this allowlist. `--max-turns` bounds each repo invocation so a stuck
      # reasoning loop cannot chew through the whole job-timeout budget.
      #
      # Every grant is spelled `Edit(...)`, never `Write(...)`: the CLI
      # matches file permissions on `Edit` rules alone --- an `Edit` grant
      # covers every file-editing tool, including `Write`, while a `Write`
      # rule is inert and only earns a warning on stderr. Creating a file
      # the repo did not have is therefore already covered.
      - name: 'Process batch ${{ matrix.batch.name }}'
        env:
          # Every batch is single-owner (the discover job chunks within each owner), so
          # this resolves to the fine-grained PAT for exactly the owner being processed.
          # A fine-grained token is bound to one resource owner, so a single shared
          # secret could never clone and push across all of them.
          GH_TOKEN: ${{ secrets[matrix.batch.secret] }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No HARDEN_OWNER here: every repo in the matrix carries its own
          # `owner`, so this job never has to guess which one it belongs to.
          REFRESH_BRANCH: 'chore/config-and-docs-refresh'
          REPOS: ${{ toJSON(matrix.batch.repos) }}
          MAX_TURNS: ${{ inputs.max_turns || '50' }}
          # Passed RAW, with the default applied in bash below. `inputs.x || '8'`
          # would break the documented `stale_after_days: 0` escape hatch: the
          # input is `type: number`, the `inputs` context preserves that type, and
          # GitHub's `||` treats `0` as falsy --- so a dispatch with `0` would
          # render `8` and the gate would stay on, leaving no way to force a
          # full-fleet refresh short of editing this file.
          STALE_AFTER_DAYS: ${{ inputs.stale_after_days }}
          # Empty on a scheduled run. Read only by the activity gate, which a
          # deliberate single-repo request overrides; under `set -u` an unset
          # name would abort the step, so it is declared here rather than
          # assumed to exist because the `discover` job also declares it.
          REPO_INPUT: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          git config --global user.name 'config-bot'
          git config --global user.email 'config-bot@users.noreply.github.com'

          PROMPT_CONTENT="$(cat "${GITHUB_WORKSPACE}/scripts/refresh_config_and_docs_prompt.md")"
          WORK_DIR="$(mktemp -d)"
          CLAUDE_LOG="${WORK_DIR}/.claude.log"
          failed=()
          prs_created=()
          prs_updated=()
          no_drift=()
          quota_skipped=()
          unchanged=()
          quota_hit=0

          # A repo whose *code* has not moved since the previous run describes
          # the same reality the previous run already judged, so the only drift
          # left to find is prose the model would re-litigate --- which is what
          # made 47 of 76 repos (62%) produce a pull request in a single week,
          # one week after the same job had refreshed them. Measured, not
          # assumed: `rios0rios0/srt` yielded two entries on 2026-08-31 and none
          # on 2026-09-01, against an unchanged `main`.
          #
          # "Code" excludes everything this workflow itself writes, and that
          # exclusion is the whole design. The obvious signal --- the default
          # branch's HEAD date --- is self-defeating here: merging a refresh PR
          # moves `main`, so every repo this job touched last week looks busy
          # the next week and gets refreshed again, which is precisely the loop
          # the gate exists to break. `pushed_at` is worse still, since it also
          # moves when the job force-pushes its own branch. Asking instead for
          # the last commit that changed anything OUTSIDE the refresh's own
          # output skips over the refresh commit, its merge commit, and the
          # bump ceremony that follows, and reports when the code the docs
          # describe actually changed.
          #
          # Stateless on purpose --- no cache, no artifact, no marker branch to
          # go stale. `stale_after_days` is one day past the weekly cadence, so
          # a repo is skipped only after a full quiet cycle.
          # The in-scope set, declared ONCE. `drift_paths` and the activity
          # gate's `:(exclude)` arguments are both derived from it below, so
          # adding a refresh target stays the documented three-place change
          # (this array, the `--allowedTools` grant, and the prompt's file
          # list) instead of silently becoming four.
          IN_SCOPE=(
            'CLAUDE.md'
            '.github/copilot-instructions.md'
            '.github/skills/code-review/SKILL.md'
          )
          # Everything the job itself writes: the in-scope set plus both
          # changelog targets. Excluded from the activity gate so the refresh's
          # own commits never count as repository activity.
          gate_excludes=()
          for path in "${IN_SCOPE[@]}" '.changes' 'CHANGELOG.md'; do
            gate_excludes+=(":(exclude)${path}")
          done

          # Defaulted here rather than in the `env:` expression so a dispatched
          # `0` survives as `0`; see the comment on STALE_AFTER_DAYS above.
          STALE_AFTER_DAYS="${STALE_AFTER_DAYS:-8}"
          if [ "${STALE_AFTER_DAYS}" -gt 0 ] 2>/dev/null; then
            stale_cutoff=$(date -u -d "${STALE_AFTER_DAYS} days ago" +%s)
            echo "Skipping repos whose code has not changed since $(date -u -d "@${stale_cutoff}" '+%Y-%m-%d %H:%M UTC')."
          else
            stale_cutoff=0
            echo 'stale_after_days=0: every repo will be refreshed regardless of activity.'
          fi

          total=$(echo "${REPOS}" | jq 'length')
          idx=0
          # Process substitution (not a pipe) so array mutations persist
          # outside the loop body.
          while IFS= read -r repo_json; do
            idx=$((idx + 1))
            repo_owner=$(echo "${repo_json}" | jq -r '.owner')
            repo_name=$(echo "${repo_json}" | jq -r '.name')
            default_branch=$(echo "${repo_json}" | jq -r '.default_branch')
            target_repo="${repo_owner}/${repo_name}"
            # Checkout directory keyed by owner too: two owners can host a
            # repo of the same name, and a bare-name path would make the
            # second clone collide with the first inside one batch.
            target="${WORK_DIR}/${repo_owner}__${repo_name}"

            # If a previous iteration tripped the org's monthly Claude
            # usage limit, skip the rest of the batch --- subsequent claude
            # invocations will all fail with the same error and just burn
            # ~3min/repo. The summary still reports them so it's visible
            # which repos didn't get a chance.
            if [ "${quota_hit}" -eq 1 ]; then
              echo "=========== [${idx}/${total}] ${target_repo} (SKIPPED: monthly Claude usage limit hit earlier in batch) ==========="
              quota_skipped+=("${target_repo}")
              continue
            fi

            echo "=========== [${idx}/${total}] ${target_repo} ==========="
            rm -rf "${target}"

            if ! git clone --quiet \
                "https://x-access-token:${GH_TOKEN}@github.com/${target_repo}.git" \
                "${target}"; then
              failed+=("clone: ${target_repo}")
              continue
            fi

            if ! git -C "${target}" checkout --quiet "${default_branch}"; then
              failed+=("checkout: ${target_repo}")
              rm -rf "${target}"
              continue
            fi

            # Activity gate. It sits AFTER the clone and BEFORE the `claude`
            # call on purpose: the clone is seconds and gives the commit date
            # for free, where the `claude` call is ~3 minutes and the whole
            # cost being avoided. A single-repo `workflow_dispatch` run is
            # never skipped --- asking for one repo by name is an explicit
            # override of the cadence.
            # A repo that has never received any of this job's output cannot be
            # judged by how quiet it is: a dormant repo with no `CLAUDE.md` would
            # be skipped on this run and on every run after it, and would never
            # get one. Quiet only means "up to date" once there is something to
            # be up to date.
            has_output=0
            for path in "${IN_SCOPE[@]}"; do
              [ -f "${target}/${path}" ] && has_output=1
            done
            if [ "${stale_cutoff}" -gt 0 ] && [ -z "${REPO_INPUT}" ] && [ "${has_output}" -eq 1 ]; then
              # `--first-parent` is load-bearing, not a tidy-up. Without it,
              # pathspec history simplification follows whichever parent a merge
              # is TREESAME to, so a branch authored on the 20th and merged on
              # the 29th reports the 20th --- and since that date only ever gets
              # older, a repo whose activity arrives as long-lived pull requests
              # is skipped on this run and on every run after it. Reproduced:
              # the same `git log` returns `2026-08-20` without the flag and
              # `2026-08-29` with it.
              #
              # `-C` puts cwd at the repo root, so `.` is the whole tree. An
              # empty result (epoch 0) means every commit in history touched
              # only excluded paths --- unknowable rather than stale, so the
              # repo is refreshed. Failing open is the right direction: the
              # cost of a needless refresh is minutes, the cost of a wrongly
              # skipped one is documentation that rots unnoticed.
              code_epoch=$(git -C "${target}" log -1 --first-parent --format=%ct \
                -- . "${gate_excludes[@]}" 2>/dev/null || echo 0)
              code_epoch="${code_epoch:-0}"
              if [ "${code_epoch}" -gt 0 ] && [ "${code_epoch}" -lt "${stale_cutoff}" ]; then
                echo "--> nothing but this job's own output has changed since $(date -u -d "@${code_epoch}" +%F); skipping."
                unchanged+=("${target_repo}")
                rm -rf "${target}"
                continue
              fi
            fi

            # Changelog convention, decided per repo and enforced by the
            # allowlist rather than by instruction alone. A chlog repo
            # *generates* `CHANGELOG.md` from the fragments under
            # `.changes/unreleased/`, so an entry written straight into it is
            # discarded by the next `chlog batch` and puts back, on that one
            # file, the rebase conflicts the fragments exist to prevent. The
            # 2026-08-31 run wrote 46 such entries because the prompt told
            # Claude to edit the CHANGELOG and the grant let it. Granting only
            # the tool the applicable convention needs makes the wrong one
            # impossible, not merely discouraged.
            #
            # The predicate is copied verbatim from the `pipelines`
            # basic-checks gate (which in turn mirrors AutoBump's
            # `DetectChlog`), so the three cannot disagree about whether a
            # repository uses chlog. A config file is optional --- chlog falls
            # back to its built-in defaults --- which is why the fragment
            # directory alone counts.
            if [ -f "${target}/.chlog.yaml" ] || [ -f "${target}/.chlog.yml" ] || [ -d "${target}/.changes/unreleased" ]; then
              changelog_mode='chlog'
              changelog_tools=',Edit(/.changes/unreleased/**)'
              changelog_note='This repository uses chlog. `CHANGELOG.md` is generated from the fragments under `.changes/unreleased/` and you have not been granted any tool that can edit it. Record the refresh as a new fragment, exactly as described under "If the repository uses chlog".'
            elif [ -f "${target}/CHANGELOG.md" ]; then
              changelog_mode='changelog'
              changelog_tools=',Edit(/CHANGELOG.md)'
              changelog_note='This repository does not use chlog. Record the refresh directly in `CHANGELOG.md` under `[Unreleased]`, exactly as described under "If the repository does not use chlog".'
            else
              changelog_mode='none'
              changelog_tools=''
              changelog_note='This repository has neither chlog nor a `CHANGELOG.md`. Do not record the refresh anywhere --- just edit whichever in-scope files drifted.'
            fi
            echo "--> changelog convention: ${changelog_mode}"
            # Built with printf rather than a literal multi-line string: the
            # appended section has to sit at column 0 to read as Markdown, and
            # a column-0 line inside this block scalar would end the YAML
            # document.
            repo_prompt="$(printf '%s\n\n---\n\n## Changelog convention for this repository\n\n%s\n' \
              "${PROMPT_CONTENT}" "${changelog_note}")"

            # `</dev/null` is load-bearing: without it `claude -p` inherits
            # the outer `while read` loop's stdin (the jq pipe) and consumes
            # the rest of the repo list, so the loop exits silently after
            # the first iteration with a misleading "Batch summary".
            #
            # `set +e` around the pipeline is equally load-bearing. Under
            # `set -e` + `pipefail` the pipeline's status *is* claude's exit
            # code, so a non-zero claude aborts the whole step on the spot
            # and `claude_rc` below is never even read. That is how a single
            # safeguard refusal on repo 7 stranded repos 8-10 of a 10-repo
            # batch, and why the quota short-circuit below had in fact never
            # run. Suspending errexit keeps a claude failure local to the
            # repo that caused it, so the loop can classify it and move on.
            #
            # Output is tee'd to ${CLAUDE_LOG} so the failure can be told
            # apart:
            #   - monthly usage limit --- the org's Claude subscription cap
            #     is exhausted. Every remaining repo would burn ~3min into
            #     the same wall, so `quota_hit=1` short-circuits the batch.
            #   - safeguard refusal --- Claude declines the repo's content
            #     (e.g. a security-topic repo trips the cybersecurity
            #     safeguard). This is deterministic for that one repo and
            #     says nothing about the others, so only it is skipped.
            #   - anything else --- transient API/network error, max-turns
            #     abort, crash. Also skipped, also non-fatal to the batch.
            #
            # PIPESTATUS[0] holds the subshell's (claude's) exit code;
            # we explicitly do not want `tee`'s exit code, which is
            # almost always 0 and would mask claude failures.
            rm -f "${CLAUDE_LOG}"
            set +e
            ( cd "${target}" && claude -p "${repo_prompt}" \
                  --model 'claude-opus-4-8' \
                  --max-turns "${MAX_TURNS}" \
                  --allowedTools "Read,Grep,Glob,Edit(/CLAUDE.md),Edit(/.github/copilot-instructions.md),Edit(/.github/skills/code-review/SKILL.md)${changelog_tools}" </dev/null ) 2>&1 | tee "${CLAUDE_LOG}"
            claude_rc=${PIPESTATUS[0]}
            set -e
            if [ "${claude_rc}" -ne 0 ]; then
              if grep -qF 'monthly usage limit' "${CLAUDE_LOG}"; then
                echo "--> monthly Claude usage limit reached; skipping the rest of this batch."
                failed+=("claude-quota: ${target_repo}")
                quota_hit=1
              elif grep -qEi 'safeguards flagged|cyber-use-case' "${CLAUDE_LOG}"; then
                echo "--> Claude's safeguards refused this repo (exit ${claude_rc}); moving on to the next one."
                failed+=("claude-safeguard: ${target_repo}")
              else
                echo "--> claude exited ${claude_rc}; moving on to the next repo."
                failed+=("claude: ${target_repo}")
              fi
              rm -rf "${target}"
              continue
            fi

            # Post-refresh enforcement of the chlog convention. The
            # allowlist above already denies every tool that could reach
            # `CHANGELOG.md` in a chlog repo, so neither branch here should
            # ever fire; they exist because the allowlist is the CLI's
            # promise rather than this workflow's, and a silently-dropped
            # grant would put the fleet straight back to hand-edited
            # changelogs. Discarding is always the right resolution: in a
            # chlog repo the next `chlog batch` discards a hand-edit anyway,
            # and a fragment already committed by an earlier PR must not be
            # rewritten by this one --- only brand-new fragments are
            # legitimate output.
            #
            # Both restores are flagged rather than bare. `git diff --quiet`
            # returns non-zero for a git error as well as for "there are
            # differences", so the restore can be reached in a state where it
            # also fails --- and a bare command in an `if` *body* is subject to
            # `errexit`, which would abort the whole leg mid-loop instead of
            # failing this one repo. Continuing anyway is not an option either:
            # a repo whose hand-edited `CHANGELOG.md` could not be reverted
            # would open a PR carrying exactly the edit this guard exists to
            # prevent, so the repo is skipped and recorded as
            # `changelog-guard:`.
            if [ "${changelog_mode}" = 'chlog' ]; then
              changelog_guard_failed=0
              if ! git -C "${target}" diff --quiet -- CHANGELOG.md; then
                echo '--> discarded a hand-edit of CHANGELOG.md: this repo generates it from chlog fragments.'
                git -C "${target}" checkout -- CHANGELOG.md || changelog_guard_failed=1
              fi
              if ! git -C "${target}" diff --quiet -- .changes; then
                echo '--> discarded edits to existing chlog fragments: only new fragments are allowed.'
                git -C "${target}" checkout -- .changes || changelog_guard_failed=1
              fi
              if [ "${changelog_guard_failed}" -eq 1 ]; then
                echo '--> could not restore the changelog target; skipping this repo.'
                failed+=("changelog-guard: ${target_repo}")
                rm -rf "${target}"
                continue
              fi
              # A fragment `chlog batch` cannot parse breaks that repo's next
              # release, which is both far away from here and hard to trace
              # back. Rejecting the repo now keeps the malformed file out of
              # the PR and turns the leg red so it is noticed this week.
              fragment_bad=''
              while IFS= read -r fragment; do
                case "${fragment}" in
                  *.yaml) ;;
                  *) fragment_bad="${fragment}"; break ;;
                esac
                if ! grep -q '^kind: .' "${target}/${fragment}" \
                  || ! grep -q '^body: .' "${target}/${fragment}" \
                  || ! grep -q '^time: .' "${target}/${fragment}"; then
                  fragment_bad="${fragment}"
                  break
                fi
              done < <(git -C "${target}" ls-files --others --exclude-standard -- .changes/unreleased)
              if [ -n "${fragment_bad}" ]; then
                echo "--> malformed chlog fragment '${fragment_bad}'; skipping this repo."
                failed+=("fragment: ${target_repo}")
                rm -rf "${target}"
                continue
              fi
            fi

            # Drift detection. `git add -N` (intent-to-add) makes newly
            # created untracked files visible to `git diff`, so a brand-new
            # CLAUDE.md in a repo that lacked one counts as drift. `git
            # diff -w` ignores whitespace-only changes so cosmetic diffs
            # don't churn PRs. Neither changelog target --- `CHANGELOG.md`
            # nor a `.changes/unreleased/` fragment --- is part of the drift
            # gate: the prompt rule says Claude only records the refresh
            # when it also modifies a refresh-scope file, so gating on the
            # refresh-scope files alone correctly suppresses spurious PRs
            # from any stray changelog-only edit. Some repos may legitimately
            # have none of these files in scope, so only diff paths that
            # exist after the refresh step and treat "no in-scope files
            # present" as no drift. Today the in-scope set
            # is the AI-assistant guidance files plus the Copilot
            # code-review skill; extend `drift_paths` (and the prompt)
            # when adding diagrams or other refresh targets.
            drift_paths=()
            for path in "${IN_SCOPE[@]}"; do
              if [ -f "${target}/${path}" ]; then
                drift_paths+=("${path}")
                git -C "${target}" add -N -- "${path}"
              fi
            done
            if [ "${#drift_paths[@]}" -eq 0 ]; then
              no_drift+=("${target_repo}")
              rm -rf "${target}"
              continue
            fi
            if git -C "${target}" diff --quiet -w -- "${drift_paths[@]}"; then
              no_drift+=("${target_repo}")
              rm -rf "${target}"
              continue
            fi

            # Idempotent branch: force-push updates the diff if a PR
            # already exists. Guarded like every other git/gh call in this
            # loop --- a bare command here would abort the whole batch under
            # `set -e` instead of failing just this repo.
            if ! git -C "${target}" checkout -B "${REFRESH_BRANCH}"; then
              failed+=("branch: ${target_repo}")
              rm -rf "${target}"
              continue
            fi
            [ -f "${target}/CLAUDE.md" ] && git -C "${target}" add CLAUDE.md
            [ -f "${target}/.github/copilot-instructions.md" ] && git -C "${target}" add .github/copilot-instructions.md
            [ -f "${target}/.github/skills/code-review/SKILL.md" ] && git -C "${target}" add .github/skills/code-review/SKILL.md
            [ -f "${target}/CHANGELOG.md" ] && git -C "${target}" add CHANGELOG.md
            [ -d "${target}/.changes/unreleased" ] && git -C "${target}" add .changes/unreleased
            git -C "${target}" add -u CLAUDE.md .github/copilot-instructions.md .github/skills/code-review/SKILL.md CHANGELOG.md 2>/dev/null || true

            if ! git -C "${target}" commit --quiet -m 'chore(refresh): refreshed configuration and documentation'; then
              failed+=("commit: ${target_repo}")
              rm -rf "${target}"
              continue
            fi

            if ! git -C "${target}" push --quiet --force --set-upstream origin "${REFRESH_BRANCH}"; then
              failed+=("push: ${target_repo}")
              rm -rf "${target}"
              continue
            fi

            # Filter by `--state open` because `gh pr view <branch>` matches
            # PRs in any state (including merged/closed). Without this filter,
            # a previously-merged PR for this branch causes the workflow to
            # log "already exists; force-push updated its diff" and skip
            # `gh pr create`, leaving the new commit stranded on a branch
            # with no open PR. The call is wrapped in `if !` because under
            # `set -e` a transient `gh` failure (auth/network/permissions)
            # in a bare command substitution would abort the whole batch
            # mid-loop, bypassing the `failed+=()` bookkeeping and the
            # per-repo cleanup; the explicit conditional keeps the failure
            # local to this repo.
            if ! existing_pr=$(gh pr list --repo "${target_repo}" --head "${REFRESH_BRANCH}" --state open --json number --jq '.[0].number // empty' 2>/dev/null); then
              failed+=("pr-list: ${target_repo}")
              rm -rf "${target}"
              continue
            fi
            if [ -n "${existing_pr}" ]; then
              echo "PR #${existing_pr} already exists; force-push updated its diff."
              prs_updated+=("${target_repo}#${existing_pr}")
            else
              if pr_url=$(gh pr create \
                  --repo "${target_repo}" \
                  --base "${default_branch}" \
                  --head "${REFRESH_BRANCH}" \
                  --title 'chore(refresh): refreshed configuration and documentation' \
                  --body $'Automated weekly refresh by `config-and-docs-refresh.yaml` in `rios0rios0/config-automation`.\n\nClaude Code reviewed the in-scope configuration and documentation files (currently `CLAUDE.md`, `.github/copilot-instructions.md`, and `.github/skills/code-review/SKILL.md`) against the current code, updated whichever drifted, and recorded the change as a `.changes/unreleased/` fragment (chlog repositories) or under `[Unreleased]` in `CHANGELOG.md` (everywhere else).\n\nReview the diff carefully --- this PR was generated by Claude Code and may contain inaccuracies.' 2>/dev/null); then
                echo "Created ${pr_url}"
                prs_created+=("${target_repo} (${pr_url})")
              else
                failed+=("pr-create: ${target_repo}")
              fi
            fi

            rm -rf "${target}"
          done < <(echo "${REPOS}" | jq -c '.[]')

          rm -rf "${WORK_DIR}"

          echo
          echo '==== Batch summary ===='
          echo "processed (${idx}/${total})"
          echo "unchanged (${#unchanged[@]}): ${unchanged[*]:-}"
          echo "no_drift (${#no_drift[@]}): ${no_drift[*]:-}"
          echo "prs_created (${#prs_created[@]}): ${prs_created[*]:-}"
          echo "prs_updated (${#prs_updated[@]}): ${prs_updated[*]:-}"
          echo "quota_skipped (${#quota_skipped[@]}): ${quota_skipped[*]:-}"
          # One per line: every entry is a "<reason>: <owner>/<repo>" pair,
          # so `${failed[*]}` space-joins them into an unreadable run-on.
          # Plain `"${failed[@]}"` is safe on an empty array under `set -u`:
          # the nounset-on-empty-array error was fixed in bash 4.4 and the
          # runner ships 5.x, so the `${failed[@]+...}` guard buys nothing
          # here and only obscures that each element stays a single word.
          echo "failed (${#failed[@]}):"
          for entry in "${failed[@]}"; do
            echo "  - ${entry}"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            exit 1
          fi

  # The discover job deliberately keeps going when an owner cannot be enumerated, so the
  # reachable owners still get refreshed. This job is what stops that tolerance from
  # quietly becoming a green run that covered only part of the fleet.
  verify:
    name: 'Verify every owner was reachable'
    needs: ['discover', 'refresh']
    if: ${{ always() && needs.discover.result != 'cancelled' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Fail when an owner could not be enumerated'
        env:
          FAILED_OWNERS: ${{ needs.discover.outputs.failed_owners }}
        run: |
          set -euo pipefail
          if [ -z "${FAILED_OWNERS}" ] || [ "${FAILED_OWNERS}" = '[]' ]; then
            echo 'Every configured owner was enumerated.'
            exit 0
          fi
          echo "::error::These owners could not be enumerated and were skipped entirely: ${FAILED_OWNERS}"
          echo 'Check that each owner has its own fine-grained PAT with a lifetime of 366 days or less.'
          exit 1
