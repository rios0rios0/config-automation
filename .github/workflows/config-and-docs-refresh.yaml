name: 'Config and Docs Refresh'

on:
  schedule:
    # Weekly on Mondays at 07:00 UTC (one hour after the compliance audit to spread load).
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target a single repo as `owner/name`, or a bare `name` to use the first configured owner (optional, defaults to all non-fork non-archived across every owner). A fork, an archived or a disabled repo is refused, as on the schedule.'
        required: false
        type: 'string'
      batch_size:
        description: 'Repos processed sequentially per matrix leg (defaults to 10).'
        required: false
        type: 'number'
        default: 10
      max_parallel:
        description: 'Concurrent matrix legs (defaults to 2 to halve wall-clock; raise carefully to stay within the Anthropic rate limit).'
        required: false
        type: 'number'
        default: 2
      max_turns:
        description: 'Max Claude turns per phase (audit and refresh) per repo (defaults to 50).'
        required: false
        type: 'number'
        default: 50

concurrency:
  group: 'config-and-docs-refresh'
  cancel-in-progress: false

jobs:
  discover:
    name: 'Enumerate and batch target repos'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
      failed_organizations: ${{ steps.discover.outputs.failed_organizations }}
    steps:
      - name: 'Checkout config-automation'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      # Derives the toolchain from `go.mod` rather than a hardcoded minor
      # version. `setup-go` exports `GOTOOLCHAIN=local`, so a `go-version`
      # spec that resolves to a cached patch release older than the `go`
      # directive (e.g. `1.26` -> 1.26.4 against `go 1.26.5`) makes every
      # `go run` hard-fail instead of downloading the newer toolchain.
      - name: 'Set up Go'
        uses: 'actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16' # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # `refresh-docs discover` lists every owner in `.config-automation.yaml`
      # with that owner's own token, since a fine-grained PAT reaches one
      # resource owner only, and chunks each owner's repos into batches so
      # every matrix leg carries one credential. An owner it cannot reach is
      # reported and the rest are still batched; the `verify` job below then
      # turns the run red. Every token's lifetime must be 366 days or less:
      # `medhub-life` and `prefy` reject longer-lived fine-grained tokens with
      # a 403. The tokens live in this step only, out of checkout and setup.
      - name: 'Discover'
        id: 'discover'
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          MEDHUB_ACCESS_TOKEN: ${{ secrets.MEDHUB_ACCESS_TOKEN }}
          PREFY_ACCESS_TOKEN: ${{ secrets.PREFY_ACCESS_TOKEN }}
          REPO_INPUT: ${{ inputs.repo }}
          BATCH_SIZE: ${{ inputs.batch_size || 10 }}
        run: |
          set -euo pipefail
          arguments=(--config .config-automation.yaml --batch-size "${BATCH_SIZE}")
          if [ -n "${REPO_INPUT}" ]; then
            arguments+=(--repo "${REPO_INPUT}")
          fi
          go run ./cmd/refresh-docs discover "${arguments[@]}"

  refresh:
    name: 'Refresh ${{ matrix.batch.name }}'
    needs: 'discover'
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Each matrix leg handles up to `batch_size` repos sequentially; legs
      # themselves run in parallel up to `max_parallel`. The default of 2
      # halves wall-clock vs. fully serial while keeping the steady-state
      # request rate well inside the Anthropic per-minute budget.
      max-parallel: ${{ fromJSON(inputs.max_parallel || '2') }}
      matrix:
        batch: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: 'Checkout config-automation'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Install Node.js 22'
        # Claude Code declares `engines.node >=22.0.0` (2.1.316). npm only warns
        # (EBADENGINE) below that floor, so keep this major at or above it.
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'

      # Same pin as the discover job: the `go` directive in go.mod decides
      # the toolchain refresh-docs is built with.
      - name: 'Set up Go'
        uses: 'actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16' # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # The Claude Code CLI, a checksum-verified chlog, and refresh-docs built
      # from this checkout, pinned in the one script the Azure Pipelines
      # template runs too.
      - name: 'Install refresh tools'
        run: |
          set -euo pipefail
          scripts/install-refresh-tools.sh "${RUNNER_TEMP}/refresh-bin"
          echo "${RUNNER_TEMP}/refresh-bin" >> "${GITHUB_PATH}"

      # `refresh-docs run` clones each repo of the batch, moves it into the
      # AGENTS.md layout, runs the read-only prompt audit and the scoped
      # refresh, guards the changelog and every added line, and opens or
      # updates the PR on the refresh branch; README and AGENTS.md describe
      # each step. A failing repo is recorded and the batch moves on, so the
      # leg turns red only after its summary.
      - name: 'Process batch ${{ matrix.batch.name }}'
        env:
          # Every batch is single-owner, so this is the fine-grained PAT of exactly
          # the owner being processed. git receives it through a credential helper
          # scoped to github.com, the PR calls through the GitHub API; Claude Code is
          # started without it.
          GH_TOKEN: ${{ secrets[matrix.batch.credential] }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          # Opus 5.5 runs at `medium` effort in Claude Code unless told otherwise.
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT || 'high' }}
          REPOS: ${{ toJSON(matrix.batch.repos) }}
          MAX_TURNS: ${{ inputs.max_turns || '50' }}
        run: 'refresh-docs run --config .config-automation.yaml --work-dir "${RUNNER_TEMP}/refresh-work"'

  # The discover job deliberately keeps going when an owner cannot be enumerated, so the
  # reachable owners still get refreshed. This job is what stops that tolerance from
  # quietly becoming a green run that covered only part of the fleet.
  verify:
    name: 'Verify every owner was reachable'
    needs: ['discover', 'refresh']
    if: ${{ always() && needs.discover.result != 'cancelled' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Fail when an owner could not be enumerated'
        env:
          FAILED_ORGANIZATIONS: ${{ needs.discover.outputs.failed_organizations }}
        run: |
          set -euo pipefail
          if [ -z "${FAILED_ORGANIZATIONS}" ] || [ "${FAILED_ORGANIZATIONS}" = '[]' ]; then
            echo 'Every configured owner was enumerated.'
            exit 0
          fi
          echo "::error::These owners could not be enumerated and were skipped entirely: ${FAILED_ORGANIZATIONS}"
          echo 'Check that each owner has its own fine-grained PAT with a lifetime of 366 days or less.'
          exit 1
