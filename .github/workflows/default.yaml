name: 'default'

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  checks: 'write' # code_check-style_golangci_lint
  security-events: 'write' # security-sast_codeql
  contents: 'write' # delivery-release

jobs:
  # Releases ship harden-repos; refresh-docs is built from source by the refresh workflow, so the
  # main package is pinned rather than auto-detected.
  default:
    uses: 'rios0rios0/pipelines/.github/workflows/go-binary.yaml@main'
    with:
      binary_name: 'harden-repos'
      binary_path: './cmd/harden-repos'
      # The shared test stage covers cmd/ and internal/ only, so the suites that run the refresh's
      # shell against local repositories run as `tests > test:scripts`, in the same stage, through
      # the pipeline's input rather than as a job of their own here that started at once, beside
      # the first stage. They build refresh-docs and run the scripts in child processes, which Go's
      # test cache does not track, so `-count=1` keeps a restored cache from replaying a pass after
      # a change to them.
      extra_test_name: 'scripts'
      extra_test_command: 'go test -count=1 ./test/scripts/...'
