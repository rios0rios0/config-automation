name: 'default'

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  checks: 'write' # code_check-style_golangci_lint
  security-events: 'write' # security-sast_codeql
  contents: 'write' # delivery-release

jobs:
  refresh-tests:
    name: 'Test prompt audit and refresh orchestration'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Checkout config-automation'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
      - name: 'Set up Go'
        uses: 'actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16' # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # The shared test stage covers cmd/ and internal/ only, so the suites that
      # run the refresh's shell against local repositories run here. They build
      # refresh-docs and run the scripts in child processes, which Go's test
      # cache does not track, so `-count=1` keeps a restored cache from
      # replaying a pass after a change to them.
      - name: 'Run shell orchestration tests'
        run: 'go test -count=1 ./test/scripts/...'

  # Releases ship harden-repos; refresh-docs is built from source by the refresh
  # workflow, so the main package is pinned rather than auto-detected.
  default:
    uses: 'rios0rios0/pipelines/.github/workflows/go-binary.yaml@main'
    with:
      binary_name: 'harden-repos'
      binary_path: './cmd/harden-repos'
