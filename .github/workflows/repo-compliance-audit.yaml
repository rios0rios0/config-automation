name: 'Repo Compliance Audit'

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: 'repo-compliance-audit'
  cancel-in-progress: false

jobs:
  audit:
    name: 'Audit every configured owner'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    env:
      # Personal access token exposed as GH_TOKEN for the Go client's
      # HTTP calls (and the pagination logic in the list endpoint).
      # If using a classic PAT, grant `repo` plus any required admin
      # access. If using a fine-grained PAT, grant the repository
      # permissions needed to list private repos and read
      # ruleset/security-related endpoints. Falls back to the default
      # GITHUB_TOKEN if the secret is not set (cross-repo calls will
      # fail).
      #
      # The token must reach every owner listed in HARDEN_OWNER: the CLI
      # treats a listing failure for any single owner as fatal, so a
      # missing organization grant fails the whole audit rather than
      # silently reporting a partial fleet as compliant.
      GH_TOKEN: ${{ secrets.COMPLIANCE_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
      # Comma-separated list of owners to audit, walked in order.
      HARDEN_OWNER: 'rios0rios0,medhub-tech,prefy'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      # Derives the toolchain from `go.mod` rather than a hardcoded minor
      # version. `setup-go` exports `GOTOOLCHAIN=local`, so a `go-version`
      # spec that resolves to a cached patch release older than the `go`
      # directive (e.g. `1.26` -> 1.26.4 against `go 1.26.5`) makes every
      # `go run` hard-fail instead of downloading the newer toolchain.
      - name: 'Set up Go'
        uses: 'actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16' # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: 'Run compliance audit'
        run: |
          go run ./cmd/harden-repos --phase 1 --fail-on-noncompliant

      - name: 'Upload audit report'
        if: always()
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'compliance-audit-${{ github.run_number }}'
          path: '/tmp/gh_hardening_audit_before.json'
          if-no-files-found: 'ignore'
          retention-days: 30
