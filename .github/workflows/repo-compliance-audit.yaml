name: 'Repo Compliance Audit'

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: 'repo-compliance-audit'
  cancel-in-progress: false

jobs:
  audit:
    name: 'Audit ${{ matrix.owner.name }}'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    strategy:
      # A fine-grained PAT is bound to a single resource owner, so one token can never span
      # every owner. The CLI also treats a listing failure for any owner as fatal, so a
      # single shared token turned one rejected grant into "no owner gets audited" --- and
      # the owners after it in the list were never even attempted. One job per owner keeps
      # each owner's credential, and each owner's failure, to itself.
      fail-fast: false
      matrix:
        owner:
          - name: 'rios0rios0'
            secret: 'COMPLIANCE_AUDIT_TOKEN'
          - name: 'medhub-tech'
            secret: 'MEDHUB_TECH_COMPLIANCE_AUDIT_TOKEN'
          - name: 'prefy'
            secret: 'PREFY_COMPLIANCE_AUDIT_TOKEN'
    env:
      # Personal access token exposed as GH_TOKEN for the Go client's
      # HTTP calls (and the pagination logic in the list endpoint).
      # If using a classic PAT, grant `repo` plus any required admin
      # access. If using a fine-grained PAT, grant the repository
      # permissions needed to list private repos and read
      # ruleset/security-related endpoints. Falls back to the default
      # GITHUB_TOKEN if the secret is not set (cross-repo calls will
      # fail).
      #
      # Each job authenticates as the owner it audits. The token's lifetime must be
      # 366 days or less: `medhub-tech` and `prefy` reject longer-lived fine-grained
      # tokens with `403 ... forbids access via a fine-grained personal access tokens
      # if the token's lifetime is greater than 366 days`.
      GH_TOKEN: ${{ secrets[matrix.owner.secret] || secrets.GITHUB_TOKEN }}
      # This job audits exactly one owner; the fan-out lives in the matrix above.
      HARDEN_OWNER: ${{ matrix.owner.name }}
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      # Derives the toolchain from `go.mod` rather than a hardcoded minor
      # version. `setup-go` exports `GOTOOLCHAIN=local`, so a `go-version`
      # spec that resolves to a cached patch release older than the `go`
      # directive (e.g. `1.26` -> 1.26.4 against `go 1.26.5`) makes every
      # `go run` hard-fail instead of downloading the newer toolchain.
      - name: 'Set up Go'
        uses: 'actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16' # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: 'Run compliance audit'
        run: |
          go run ./cmd/harden-repos --phase 1 --fail-on-noncompliant

      - name: 'Upload audit report'
        if: always()
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'compliance-audit-${{ github.run_number }}-${{ matrix.owner.name }}'
          path: '/tmp/gh_hardening_audit_before.json'
          if-no-files-found: 'ignore'
          retention-days: 30
