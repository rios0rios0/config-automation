# The config-and-docs refresh as Azure Pipelines jobs: `discover` lists the
# organizations of the consumer's configuration file into a matrix, each
# `refresh` leg runs `refresh-docs run` on one batch, and `verify` fails the run
# when an organization could not be listed. The consumer owns the
# stage around these jobs, its condition and its `dependsOn`, and its
# variables, which must provide the secrets AZURE_DEVOPS_PAT and
# CLAUDE_CODE_OAUTH_TOKEN; it may also set CLAUDE_MODEL and CLAUDE_EFFORT. Every
# value here is a parameter, so this template carries no organization's data.
parameters:
  # The repository resource alias under which the consumer declares this repository.
  - name: 'toolRepository'
    type: 'string'
    default: 'config_automation'
  # The full commit SHA the consumer pinned that resource's tag to.
  - name: 'expectedSha'
    type: 'string'
  # The configuration file, relative to the consumer's repository root.
  - name: 'configFile'
    type: 'string'
    default: '.config-automation.yaml'
  # Refresh one repository, as `project/name`, instead of the whole organization.
  - name: 'repo'
    type: 'string'
    default: ''
  - name: 'batchSize'
    type: 'number'
    default: 25
  - name: 'maxParallel'
    type: 'number'
    default: 2
  - name: 'maxTurns'
    type: 'number'
    default: 50
  # More variables for both steps, as `NAME: '$(variable)'`: whatever `${VAR}`
  # the configuration file reads, such as the git identity or the token of a
  # second organization. Azure Pipelines gives a step only its non-secret
  # variables unless they are mapped. `refresh-docs run` withholds every token
  # variable the configuration names from Claude Code.
  - name: 'environment'
    type: 'object'
    default: {}

jobs:
  - job: 'discover'
    displayName: 'Enumerate and batch target repositories'
    steps:
      - template: '../steps/refresh-tool-checkout.yaml'
        parameters:
          toolRepository: '${{ parameters.toolRepository }}'
          expectedSha: '${{ parameters.expectedSha }}'

      - bash: |
          set -euo pipefail
          arguments=(--config "$(Pipeline.Workspace)/consumer/${CONFIG_FILE}" --batch-size "${BATCH_SIZE}" --ci azure-pipelines)
          if [ -n "${REPO}" ]; then
            arguments+=(--repo "${REPO}")
          fi
          go run ./cmd/refresh-docs discover "${arguments[@]}"
        workingDirectory: '$(Pipeline.Workspace)/tool'
        env:
          AZURE_DEVOPS_PAT: '$(AZURE_DEVOPS_PAT)'
          CONFIG_FILE: '${{ parameters.configFile }}'
          BATCH_SIZE: '${{ parameters.batchSize }}'
          REPO: '${{ parameters.repo }}'
          ${{ each variable in parameters.environment }}:
            ${{ variable.key }}: '${{ variable.value }}'
        name: 'set_matrix'
        displayName: 'Build the batched matrix'

  - job: 'refresh'
    # Azure DevOps appends the matrix key to a matrix job's display name, so
    # this renders as `Refresh batch_02`.
    displayName: 'Refresh'
    dependsOn: 'discover'
    condition: and(succeeded(), ne(dependencies.discover.outputs['set_matrix.count'], '0'))
    timeoutInMinutes: 240
    strategy:
      maxParallel: ${{ parameters.maxParallel }}
      matrix: $[ dependencies.discover.outputs['set_matrix.repoMatrix'] ]
    variables:
      refreshModel: $[ coalesce(variables['CLAUDE_MODEL'], 'claude-opus-5-5') ]
      # Opus 5.5 runs at `medium` effort in Claude Code unless told otherwise.
      refreshEffort: $[ coalesce(variables['CLAUDE_EFFORT'], 'high') ]
    steps:
      - template: '../steps/refresh-tool-checkout.yaml'
        parameters:
          toolRepository: '${{ parameters.toolRepository }}'
          expectedSha: '${{ parameters.expectedSha }}'

      # Claude Code declares `engines.node >=22.0.0`; npm only warns
      # (EBADENGINE) below that floor, so keep this major at or above it.
      - task: 'UseNode@1'
        inputs:
          version: '22.x'
        displayName: 'Install Node.js 22'

      - bash: |
          set -euo pipefail
          scripts/install-refresh-tools.sh "$(Agent.TempDirectory)/refresh-bin"
          echo "##vso[task.prependpath]$(Agent.TempDirectory)/refresh-bin"
        workingDirectory: '$(Pipeline.Workspace)/tool'
        displayName: 'Install refresh tools'

      # A leg's `credential` is the `credential` of its organization in the
      # configuration: the variable holding that organization's token, mapped
      # through `environment`. Without one, the token is AZURE_DEVOPS_PAT.
      - bash: |
          set -euo pipefail
          refresh-docs run --config "$(Pipeline.Workspace)/consumer/${CONFIG_FILE}" \
            --token-env "${CREDENTIAL:-AZURE_DEVOPS_PAT}" \
            --work-dir "$(Agent.TempDirectory)/refresh-work" --ci azure-pipelines
        workingDirectory: '$(Pipeline.Workspace)/tool'
        env:
          AZURE_DEVOPS_PAT: '$(AZURE_DEVOPS_PAT)'
          CLAUDE_CODE_OAUTH_TOKEN: '$(CLAUDE_CODE_OAUTH_TOKEN)'
          CLAUDE_MODEL: '$(refreshModel)'
          CLAUDE_EFFORT: '$(refreshEffort)'
          CONFIG_FILE: '${{ parameters.configFile }}'
          REPOS: '$(repos)'
          CREDENTIAL: '$(credential)'
          MAX_TURNS: '${{ parameters.maxTurns }}'
          ${{ each variable in parameters.environment }}:
            ${{ variable.key }}: '${{ variable.value }}'
        displayName: 'Process batch'

  # `discover` keeps going when an organization cannot be listed, so the
  # reachable ones are still refreshed. This job is what stops that tolerance
  # from becoming a green run that covered only part of the fleet.
  - job: 'verify'
    displayName: 'Verify every organization was reachable'
    dependsOn: ['discover', 'refresh']
    condition: not(canceled())
    variables:
      failedOrganizations: $[ dependencies.discover.outputs['set_matrix.failed_organizations'] ]
    steps:
      - checkout: 'none'
      - bash: |
          set -euo pipefail
          # Empty when `discover` failed before writing its outputs, which
          # already turns the run red.
          if [ -z "${FAILED_ORGANIZATIONS}" ] || [ "${FAILED_ORGANIZATIONS}" = '[]' ]; then
            echo 'Every configured organization was enumerated.'
            exit 0
          fi
          echo "##vso[task.logissue type=error]These organizations could not be enumerated and were skipped entirely: ${FAILED_ORGANIZATIONS}"
          exit 1
        env:
          FAILED_ORGANIZATIONS: '$(failedOrganizations)'
        displayName: 'Fail when an organization could not be enumerated'
